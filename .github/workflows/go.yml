# This workflow builds, tests, and lints the Go project.

# The conformance suite is docker-heavy and sequential: under a single CI
# runner it runs ~2x slower than locally (33-45m) and individual docker
# operations exceed the tests' 60s job waits, collapsing into a cascade of
# timeouts (observed on every full-suite CI run). The suite is split into
# three matrix shards by test-name range, each on its own runner: a shard
# holds roughly a third of the docker load, fits comfortably in the 45m
# budget, and a contention cascade in one shard no longer fails the others
# (fail-fast: false).

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A push supersedes its own in-flight runs: parallel pushes would
# otherwise duplicate the docker-heavy conformance suite on shared
# runners. cancel-in-progress applies to same-ref pushes only; a PR and
# its base branch never cancel each other.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Build
        run: go build -v ./...

      - name: Test (root unit tests)
        run: go test -timeout 15m .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          # three balanced thirds of the descriptive-name conformance suite
          - name: shard-1
            pattern: 'Test(AcceptReturnCode|AccumulateAcrossCommits|AppendWithinCommit|AppliesCustomization|AutoscalingRampsToDatumCount|BackupRestoreRoundTrip|BranchInspectListDelete|BurstManyPipelines|CancelRunningJob|ChangedHeaderReprocessesAll|ChangedTransformDoesNotReprocessUnchangedDatums|ChunkSpecOutputComplete|CommandlessPipelineCopies|CommitDescriptionStartFinishOverride|ConfigExtractionRoundTrip|CopyOutToInWithOverwriteProtection|CrashThenUpdate|CreateWithoutNameRejected|CreateWithoutTransformRejected|CronCadenceSurvivesUpdates|CronInputs|CrossDuplicateNamesRejected|CrossInputProcessesEveryCombination|CrossInputsTwoBranchesSameRepo|CrossUnionHeadResolution|CustomEnvVarsVisible|DatumStatsAcrossJobs|DatumStatusRestart|DatumTimeoutControl|DatumTimeoutRecorded|DatumTries|DeferredProcessingAcrossBranches|DeleteAndRecreateReprocesses|DeleteCommitCascadesThroughDAG|DeleteHeadSupersedesInflightJob|DeleteJobFinalizesOutput|DeleteMidDAGGuard|DeleteRepoAfterMembershipChange|DeleteSemantics|DeleteStandbyPipeline|DelimitedUploadsReplicateHeader|DetailedRendering|DiamondProvenanceOneCommitPerStage|EachCommitCumulativeJob|EgressFailure|EgressFileDestination|EmptyCommitBlocksParentReads|EmptyCommitsTriggerJobsNoStdinDeadlock|EmptyFilesAreReal|EmptyFilesReachExecution|ErrorHandlingCommands|FailedDatumsListedFirst|FailedJobFailsDownstream|FanOutDistinctNames|FanOutSharedRepo|Fetch_RejectsLinkLocal|FileFetchHeaders|FileRevisionHistory|FlushChainRepeated|FullReset|GarbageCollection|GitBranchFilter|GitCloneFailure|GitCustomName|GitDuplicateNamesAndURLs|GitPushCommitsAndTriggers|GitURLValidation|GlobalLogStore)'
          - name: shard-2
            pattern: 'Test(GroupInputs|HeadJobSeesAccumulatedContent|HeadOnlyOneOutputCommit|HyphenatedRepoName|IncompletePipeline|InputDataModifications|InputDefaultsMaterialized|InputNamedOutAndMissingGlobRejected|InputRepoEnvVar|InspectJobByJobOrOutputCommit|JobMetadataEnvVars|JobSamePathDatumConcat|JobTimeout|JoinInputPairsByKey|KeepRepoOnDelete|LargeFilesPassThroughByteForByte|LargeOutputAcrossParallelWorkers|LazyPropagatesThroughChain|LazyUnreadFilesDoNotBlock|LifecycleStates|ListDatum|ListDatumDuringJob|ListJobInputCommits|ListJobsFilteredByOutputCommit|ListJobsFilteredByStates|LogQueries|LogsWithoutStats|Main|MalformedPipelineRequestsRejected|ManyLogs|ManyUpdates|MaxQueueSize|MetricsEndpoint|MidCommitVisibility|MidDAGCommitOneWavePerStage|MidFlightJobRecordedFailedOnRestart|MixedParallelismRejected|MultipleInputsFromTheSameBranch|NamedInputPreservesFile|NamesWithHyphensAndUnderscores|NoCommandAcceptedButFailsAtStart|NoLimitsInjected|NoPanicOnEmptyRequests|NonReducedProvenanceOneCommitPerPath|NonexistentInputRepoRejected|OuterJoinKeepsUnmatchedOuterOnly|OverwriteReplaces|PaginatedDatumListing|ParallelPipelineProducesAllPerDatumOutputs|PartialResourceSpecsAccepted|PerDatumStatistics|PipelineAfterHistoryProcessesHead|PipelineDescriptionRoundTrips|PipelineFailureMentionsDatum|PipelineJobCounts|PipelineNamePathEscapeRejected|PipelineNameUniqueness|PipelineOnStatsBranch|PlacementLabels|PodPatchVolume|QueueSerializes|RecursiveDirectoryCopy|RejectsBadServiceSpecs|RejectsMalformedCustomization|RemoteServiceReachable|RepoSize|RepoSizeEqualsHeadFileBytes|ReprocessEveryJob)'
          - name: shard-3
            pattern: 'Test(ReprocessReplacesPriorOutput|ResetRemovesStatsState|ResetRobustness|ResourceLimitsApplied|ResourceRequestsApplied|RestartKeepsDataAndPipelines|RestartSingleInstance|RunPipeline|SameMountPathMerges|SecretBinding|SecretBindingRejectsMissing|SecretBindingSurvivesRestart|SecretsCRUD|Secrets_NameValidation|SelfReferentialInputRejected|SequentialPushes|ServiceLocalContainerReachable|ServicePipeline|SingleInputPipelineCopiesInputFiles|SizeTriggerLedgerSurvivesRestart|SizeTriggers|SkippedEdgeCase|SlowDatumsParallelCompleteness|SpecCommitCleanup|SpecRepoProtected|SpecialOutputFileFails|SplitNumberingAcrossCommits|SplitTransactionDelete|SpoutEpochsAndMarker|SpoutPipelines|StandbyChainAndManyCommits|StandbyIdlesWithZeroContainers|StandbyLifecycle|StatsCanBeEnabledNotDisabled|StatsSurviveUpdate|StopJob|StopMidChainNoSpuriousDownstreamCommit|StopStandbyPipeline|StoppedIgnoresRestartBacklog|SurvivesDeletedOutputRepo|SymlinkOutputs|TagDelete|TagsListAndRetrieve|ThousandsOfFilesInOneCommit|TransactionAtomicApply|TransactionInvalidatedByExternalUpdate|TruncatedAndFullListing|TwentyThousandOutputFiles|TxAbortLeavesNoSpecCommits|TxInspectList|UnchangedDatumsNotReprocessed|UnionComposition|UnionReprocessesRemovedIdenticalDatums|UnplaceableRecovery|UnprovisionableEnvironmentCrashes|UnsatisfiableResourcesAcceptedAndRecorded|UpdateChangesTransform|UpdateFinalizesPendingWork|UpdateFixesFailingPipeline|UpdateKillsInFlight|UpdatePipelineWithOnlyFailedJob|UpdateStoppedPipeline|UpdateWithUnchangedInputKeepsDedup|UpstreamOutputInsideCross|UrlIngestionJsonSpecPipelines|UseMultipleWorkers|UserIdentityAndWorkingDir|VersionAncestry|VersionedHistory)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # the suite's images are used with lazy docker pulls; warming the
      # runner's cache removes pull latency from the first container runs.
      # Tags are pinned: a floating tag (alpine:latest) can break CI with
      # no code change.
      - name: Prepare docker images
        run: |
          docker pull alpine:3.21
          docker pull python:3.12-alpine

      - name: Conformance (${{ matrix.shard.name }})
        run: go test -timeout 45m ./conformance/ -run '${{ matrix.shard.pattern }}'

      - name: CLI smoke + root unit tests
        if: matrix.shard.name == 'shard-3'
        run: |
          go test -timeout 15m ./cli/...
          go test -timeout 15m .

  race:
    # race-detector pass over the fast suites (root unit tests + the
    # docker-gated cli smoke, which runs a real container daemon). The
    # conformance suite is excluded: with -race it exceeds a practical CI
    # budget.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test -race -timeout 15m . ./cli/...
