# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
# This workflow builds, tests, and lints the Go project

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Build
        run: go build -v ./...

      - name: Test
        # the conformance suite is docker-heavy and exceeds 30m under CI
        # runner load (observed: timeout cascades at ~33m); 45m fits the
        # worst observed run while still failing on a genuine hang
        run: go test -timeout 45m ./...

  race:
    # race-detector pass over the fast suites (root unit tests + the
    # docker-gated cli smoke, which runs a real container daemon). The
    # conformance suite is excluded: with -race it exceeds a practical CI
    # budget.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test -race -timeout 15m . ./cli/...
