# This workflow builds, tests, and lints the Go project.

# The conformance suite is docker-heavy and sequential: under a single CI
# runner it runs ~2x slower than locally (33-45m) and individual docker
# operations exceed the tests' 60s job waits, collapsing into a cascade of
# timeouts (observed on every full-suite CI run). The suite is split into
# three matrix shards by test-name range, each on its own runner: a shard
# holds roughly a third of the docker load, fits comfortably in the 45m
# budget, and a contention cascade in one shard no longer fails the others
# (fail-fast: false).
#
# The Linux/amd64 shards stay the load-bearing suite. Two further jobs
# cover the other shipped platforms: `arm64` runs the daemon and a
# container-facing subset natively on an arm64 runner, and `macos` runs
# the daemon, store, scheduler, and fabric on darwin/arm64 (GitHub's macOS
# runners have no docker, so the container-facing tests self-skip there).

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A push supersedes its own in-flight runs: parallel pushes would
# otherwise duplicate the docker-heavy conformance suite on shared
# runners. cancel-in-progress applies to same-ref pushes only; a PR and
# its base branch never cancel each other.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - name: Test metacontroller worker hook
        run: node --test deploy/k8s/test/sync.test.js

      - name: Build
        run: go build -v ./...

      - name: Test (root unit tests)
        run: go test -timeout 15m . ./client/ ./internal/...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          # three balanced thirds of the descriptive-name conformance suite
          - name: shard-1
            pattern: 'Test(AcceptReturnCode|AccumulateAcrossCommits|AppendWithinCommit|AppliesCustomization|AutoscalingRampsToDatumCount|BackupRestoreRoundTrip|BranchInspectListDelete|BurstManyPipelines|CancelRunningJob|ChangedHeaderReprocessesAll|ChangedTransformDoesNotReprocessUnchangedDatums|ChunkSpecOutputComplete|CommandlessPipelineCopies|CommitDescriptionStartFinishOverride|ConfigExtractionRoundTrip|CopyOutToInWithOverwriteProtection|CrashThenUpdate|CreateWithoutNameRejected|CreateWithoutTransformRejected|CronCadenceSurvivesUpdates|CronInputs|CrossDuplicateNamesRejected|CrossInputProcessesEveryCombination|CrossInputsTwoBranchesSameRepo|CrossUnionHeadResolution|CustomEnvVarsVisible|DatumStatsAcrossJobs|DatumStatusRestart|DatumTimeoutControl|DatumTimeoutRecorded|DatumTries|DeferredProcessingAcrossBranches|DeleteAndRecreateReprocesses|DeleteCommitCascadesThroughDAG|DeleteHeadSupersedesInflightJob|DeleteJobFinalizesOutput|DeleteMidDAGGuard|DeleteRepoAfterMembershipChange|DeleteSemantics|DeleteStandbyPipeline|DelimitedUploadsReplicateHeader|DetailedRendering|DiamondProvenanceOneCommitPerStage|EachCommitCumulativeJob|EgressFailure|EgressFileDestination|EmptyCommitBlocksParentReads|EmptyCommitsTriggerJobsNoStdinDeadlock|EmptyFilesAreReal|EmptyFilesReachExecution|ErrorHandlingCommands|FailedDatumsListedFirst|FailedJobFailsDownstream|FailedJobPreservesSuccessfulOutputs|FanOutDistinctNames|FanOutSharedRepo|Fetch_RejectsLinkLocal|FileFetchHeaders|FileRevisionHistory|FlushChainRepeated|FullReset|GarbageCollection|GitBranchFilter|GitCloneFailure|GitCustomName|GitDuplicateNamesAndURLs|GitPushCommitsAndTriggers|GitURLValidation|GlobalLogStore)'
          - name: shard-2
            pattern: 'Test(GroupInputs|HeadJobSeesAccumulatedContent|HeadOnlyOneOutputCommit|HyphenatedRepoName|IncompletePipeline|InputDataModifications|InputDefaultsMaterialized|InputNamedOutAndMissingGlobRejected|InputRepoEnvVar|InspectJobByJobOrOutputCommit|JobMetadataEnvVars|JobSamePathDatumConcat|JobTimeout|JoinInputPairsByKey|KeepRepoOnDelete|LargeFilesPassThroughByteForByte|LargeOutputAcrossParallelWorkers|LazyPropagatesThroughChain|LazyUnreadFilesDoNotBlock|LifecycleStates|ListDatum|ListDatumDuringJob|ListJobInputCommits|ListJobsFilteredByOutputCommit|ListJobsFilteredByStates|LogQueries|LogsWithoutStats|Main|MalformedPipelineRequestsRejected|ManyLogs|ManyUpdates|MaxQueueSize|MetricsEndpoint|MidCommitVisibility|MidDAGCommitOneWavePerStage|MidFlightJobRecordedFailedOnRestart|MixedParallelismRejected|MultipleInputsFromTheSameBranch|NamedInputPreservesFile|NamesWithHyphensAndUnderscores|NoCommandAcceptedButFailsAtStart|NoLimitsInjected|NoPanicOnEmptyRequests|NonReducedProvenanceOneCommitPerPath|NonexistentInputRepoRejected|OuterJoinKeepsUnmatchedOuterOnly|OverwriteReplaces|PaginatedDatumListing|ParallelPipelineProducesAllPerDatumOutputs|PartialResourceSpecsAccepted|PerDatumStatistics|PipelineAfterHistoryProcessesHead|PipelineDescriptionRoundTrips|PipelineFailureMentionsDatum|PipelineJobCounts|PipelineNamePathEscapeRejected|PipelineNameUniqueness|PipelineOnStatsBranch|PlacementLabels|PodPatchVolume|QueueSerializes|RecursiveDirectoryCopy|RejectsBadServiceSpecs|RejectsMalformedCustomization|RemoteServiceReachable|RepoSize|RepoSizeEqualsHeadFileBytes|ReprocessEveryJob)'
          - name: shard-3
            pattern: 'Test(GpuRequestUnplaceableCrashes|ReprocessReplacesPriorOutput|ResetRemovesStatsState|ResetRobustness|ResourceLimitsApplied|ResourceRequestsApplied|RestartKeepsDataAndPipelines|RestartSingleInstance|RunPipeline|SameMountPathMerges|SecretBinding|SecretBindingRejectsMissing|SecretBindingSurvivesRestart|SecretsCRUD|Secrets_NameValidation|SelfReferentialInputRejected|SequentialPushes|ServiceLocalContainerReachable|ServicePipeline|SingleInputPipelineCopiesInputFiles|SizeTriggerLedgerSurvivesRestart|SizeTriggers|SkippedEdgeCase|SlowDatumsParallelCompleteness|SpecCommitCleanup|SpecRepoProtected|SpecialOutputFileFails|SplitNumberingAcrossCommits|SplitTransactionDelete|SpoutEpochsAndMarker|SpoutPipelines|StandbyChainAndManyCommits|StandbyIdlesWithZeroContainers|StandbyLifecycle|StatsCanBeEnabledNotDisabled|StatsSurviveUpdate|StopJob|StopMidChainNoSpuriousDownstreamCommit|StopStandbyPipeline|StoppedIgnoresRestartBacklog|SurvivesDeletedOutputRepo|SymlinkOutputs|TagDelete|TagsListAndRetrieve|ThousandsOfFilesInOneCommit|TransactionAtomicApply|TransactionInvalidatedByExternalUpdate|TruncatedAndFullListing|TwentyThousandOutputFiles|TxAbortLeavesNoSpecCommits|TxInspectList|UnchangedDatumsNotReprocessed|UnionComposition|UnionReprocessesRemovedIdenticalDatums|UnplaceableRecovery|UnprovisionableEnvironmentCrashes|UnsatisfiableResourcesAcceptedAndRecorded|UpdateChangesTransform|UpdateFinalizesPendingWork|UpdateFixesFailingPipeline|UpdateKillsInFlight|UpdatePipelineWithOnlyFailedJob|UpdateStoppedPipeline|UpdateWithUnchangedInputKeepsDedup|UpstreamOutputInsideCross|UrlIngestionJsonSpecPipelines|UseMultipleWorkers|UserIdentityAndWorkingDir|VersionAncestry|VersionedHistory)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # the suite's images are used with lazy docker pulls; warming the
      # runner's cache removes pull latency from the first container runs.
      # Tags are pinned: a floating tag (alpine:latest) can break CI with
      # no code change.
      - name: Prepare docker images
        run: |
          docker pull alpine:3.21
          docker pull python:3.12-alpine

      - name: Conformance (${{ matrix.shard.name }})
        run: go test -timeout 45m ./conformance/ -run '${{ matrix.shard.pattern }}'

      - name: CLI smoke + root unit tests
        if: matrix.shard.name == 'shard-3'
        run: |
          go test -timeout 15m ./cli/...
          go test -timeout 15m .

  race:
    # race-detector pass over the fast suites (root unit tests + the
    # docker-gated cli smoke, which runs a real container daemon). The
    # conformance suite is excluded: with -race it exceeds a practical CI
    # budget.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test -race -timeout 15m . ./cli/...

  arm64:
    # linux/arm64 is a released platform (release.yml ships
    # sandman-linux-arm64) that CI has never executed: every other job
    # runs on an amd64 host, so an arm64-only bug — a width assumption,
    # an image without an arm64 manifest, a syscall that behaves
    # differently — would ship unexercised. This job runs the daemon, the
    # unit tests, and the container-facing subset natively on an arm64
    # runner, and cross-builds the darwin assets so a PR cannot break the
    # macOS release either.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every target is static, so darwin builds from this runner; the
      # point is that the darwin code paths (hoststats_darwin.go, the
      # release asset names) compile on every PR, not only at tag time.
      - name: Cross-build the darwin targets
        run: |
          for arch in amd64 arm64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /dev/null .
          done

      - name: Test (root unit tests, native arm64)
        run: go test -timeout 15m . ./client/ ./internal/...

      - name: Prepare docker images
        run: docker pull alpine:3.21

      - name: Conformance (container-facing subset, native arm64)
        run: |
          go test -timeout 30m ./conformance/ -run 'Test(CrashThenUpdate|ResourceLimitsApplied|UserIdentityAndWorkingDir|SingleInputPipelineCopiesInputFiles)$'

  macos:
    # darwin/arm64 is a supported platform: `make install` writes a
    # per-user launchd agent and platform.go puts the state directory
    # under ~/Library/Application Support. GitHub's macOS runners have no
    # docker, so the container-facing tests self-skip; what runs here is
    # the daemon, the store, the scheduler, and the fabric on the process
    # backend — the code the port actually changed — plus Apple's own
    # plutil validating the agents the installer writes.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test (root unit tests)
        run: go test -timeout 15m . ./client/ ./internal/...

      - name: Check the launchd agents install cleanly
        # The macOS install bakes this node's paths into the agents (a
        # plist cannot express $HOME). plutil is the platform's own
        # validator, so a malformed agent fails here instead of at login.
        run: |
          make PREFIX="$RUNNER_TEMP/prefix" \
               LAUNCH_AGENTS="$RUNNER_TEMP/LaunchAgents" \
               SANDMAN_LOG_DIR="$RUNNER_TEMP/Logs" \
               build do-install
          for p in "$RUNNER_TEMP/LaunchAgents"/*.plist; do plutil -lint "$p"; done
          plutil -p "$RUNNER_TEMP/LaunchAgents/dev.sandman.worker.plist"
          # A valid plist can still be a useless agent: every job is a
          # docker CLI subprocess, so the agent's PATH must reach the CLI
          # Docker Desktop installs under $HOME/.docker/bin. It advertises
          # that directory only from ~/.zprofile, which launchd never
          # reads, and it links into /usr/local/bin only when its
          # privileged helper ran — so the path has to be in the agent,
          # and no @SANDMAN_*@ token may survive the install.
          for p in "$RUNNER_TEMP/LaunchAgents"/*.plist; do
            plutil -p "$p" | grep -qF "$HOME/.docker/bin" || {
              echo "$p: agent PATH cannot reach the docker CLI under \$HOME/.docker/bin"; exit 1; }
            if grep -qF '@SANDMAN_' "$p"; then
              echo "$p: unsubstituted installer token"; exit 1
            fi
          done

      - name: Conformance (daemon + engine, process backend)
        run: |
          go test -timeout 30m ./conformance/ -run 'Test(SingleInputPipelineCopiesInputFiles|RunPipeline|RestartKeepsDataAndPipelines|SecretsCRUD|BackupRestoreRoundTrip|ResetRobustness|ListJobsFilteredByStates|PipelineFailureMentionsDatum|CronCadenceSurvivesUpdates|TransactionAtomicApply|BranchInspectListDelete|MetricsEndpoint)$'
