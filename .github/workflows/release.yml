# Builds and publishes a GitHub release for every pushed v* tag. The
# `sandman update` self-update path consumes the per-platform binary
# assets (sandman-<os>-<arch> plus its <os>-<arch>.sha256, see
# update.go), so cutting a release is exactly:
#
#   git tag v0.0.2 && git push origin v0.0.2
#
# No manual build or upload — the workflow builds with the tag baked in
# (-X main.Version), checksum-ships the binaries, and creates the
# release with a changelog of the commits since the previous tag.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the previous tag

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in "linux amd64" "linux arm64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-X main.Version=$GITHUB_REF_NAME" \
              -o dist/sandman-$1-$2 .
            # cd so sha256sum records the bare filename: the asset label
            # matches the downloaded name (a "dist/..." label breaks
            # `sha256sum -c` for humans; the update parser only reads the
            # hex, but the label should not lie)
            (cd dist && sha256sum sandman-$1-$2 > sandman-$1-$2.sha256)
          done
          ls -la dist/

      # the Debian packages declare Depends: containerd, runc — the
      # distro container runtime, no docker. Build one per arch from the
      # freshly built binaries so the tag's version is baked in.
      - name: Build Debian packages
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch ./packaging/make-deb.sh "$GITHUB_REF_NAME"
            mv build/*.deb dist/
            (cd dist && sha256sum sandman_${GITHUB_REF_NAME}_${arch}.deb > sandman_${GITHUB_REF_NAME}_${arch}.deb.sha256)
          done
          ls -la dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "Automated release $GITHUB_REF_NAME." > /tmp/notes.txt
          if [ -n "$prev" ]; then
            echo "" >> /tmp/notes.txt
            echo "## Changes since $prev" >> /tmp/notes.txt
            git log --oneline --no-merges "$prev..HEAD" >> /tmp/notes.txt || true
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; uploading assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "sandman $GITHUB_REF_NAME" --notes-file /tmp/notes.txt
          fi
          gh release view "$GITHUB_REF_NAME" --json name,tagName,assets \
            -q '"published " + .name + " (" + .tagName + ") with " + ([.assets[].name] | join(", "))'
