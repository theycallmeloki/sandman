apiVersion: v1
kind: Namespace
metadata:
  name: sandman
  labels:
    # the worker pod needs hostNetwork + a privileged dockerd-in-Docker
    # sidecar to run job containers (Talos nodes have no host dockerd)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
