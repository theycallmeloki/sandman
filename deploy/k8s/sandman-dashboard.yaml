            {
              "expr": "sum(rate(sandman_file_read_seconds_sum{outcome=\"success\"}[$__rate_interval])) / clamp_min(sum(rate(sandman_file_read_seconds_count{outcome=\"success\"}[$__rate_interval])), 1)",
