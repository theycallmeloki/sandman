              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(sandman_api_request_seconds_bucket{op=~\"$op\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
