apiVersion: v1
kind: ConfigMap
metadata:
  name: sandman-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sandman-dashboard.json: |-
    {
      "title": "Sandman Control Plane",
      "uid": "sandman-control-plane",
      "tags": [
        "sandman",
        "fleet",
        "data-plane"
      ],
      "timezone": "browser",
      "schemaVersion": 37,
      "refresh": "15s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "op",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(sandman_api_requests_total, op)",
            "query": {
              "query": "label_values(sandman_api_requests_total, op)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": true,
            "allValue": ".*",
            "sort": 3
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Hosts Registered",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sandman_hosts_total",
              "legendFormat": "__auto",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "links": []
        },
        {
          "id": 2,
          "title": "Hosts with GPUs",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
