# DecoratorController: one sandman worker pod per node, with the pod's
# args derived from the node (name, IP, sandman/* labels, GPU capacity).
# Label changes reconcile the pod (OnDelete -> recreate) without any
# manifest change, fully declarative in-cluster.
apiVersion: metacontroller.k8s.io/v1alpha1
kind: DecoratorController
metadata:
  name: sandman-worker
spec:
  resources:
  - apiVersion: v1
    resource: nodes
    # kubelet heartbeats update node status every few seconds; without
    # this every heartbeat re-synced every worker pod
    ignoreStatusChanges: true
  # periodic resync: without it, and with ignoreStatusChanges on, a
  # ConfigMap-only change (e.g. a worker image bump) never re-triggers a
  # node sync — the fleet would stay on the old image until a label
  # change. 300s converges any desired-state drift within five minutes.
  resyncPeriodSeconds: 300
  # v4 schema: the child rule list is `attachments` (childResources was
  # the pre-v4 name and is silently pruned — the controller then never
  # sees its own pods and tries to create them forever).
  # updateStrategy: Recreate — label changes delete+recreate the worker
  # pod (k8s forbids pod updates to args, so InPlace cannot apply them;
  # OnDelete never touches existing children). Convergence requires the
  # desired spec to match the stored pod byte-for-byte: no auto-mounted
  # service-account token volume (random suffix per create) and no empty
  # env values (the API omits them). ignoreStatusChanges stops node
  # heartbeats from re-syncing every worker pod.
  attachments:
  - apiVersion: v1
    resource: pods
    updateStrategy:
      method: Recreate
  hooks:
    sync:
      webhook:
        url: http://sandman-worker-hook.sandman/sync
