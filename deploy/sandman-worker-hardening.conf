# Hardening drop-in for sandman-worker.service, installed as
# /etc/systemd/system/sandman-worker.service.d/10-hardening.conf.
#
# Deliberately no PrivateTmp: the worker creates job scratch dirs under
# /tmp and asks the host dockerd (outside this service's mount
# namespace) to bind-mount them. A private /tmp would be invisible to
# dockerd and every remote placement would fail. ProtectSystem below
# leaves /tmp writable.
#
# As with the daemon, this does not make the docker socket safe: the
# worker's docker group is root-equivalent, and its /exec endpoint is
# unauthenticated. The firewall/CNI rule and trusted-LAN boundary remain
# the access control (docs/security/sandman-threat-model.md).
[Service]
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=read-only
# ProtectSystem=strict makes the whole hierarchy read-only. The worker must
# still create job scratch under the host's /tmp (not a private tmpfs) and
# may write its docker CLI HOME.
ReadWritePaths=/tmp
ReadWritePaths=/var/lib/sandman
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
