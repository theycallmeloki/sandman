# Hardening drop-in for sandman.service, installed as
# /etc/systemd/system/sandman.service.d/10-hardening.conf.
#
# This is defence in depth for a service that still holds a docker socket.
# Root-equivalence of the socket is NOT removed: anyone who can use
# /var/run/docker.sock can start a privileged container and become root.
# The directives below constrain the daemon process itself; network
# peers and the trusted-LAN boundary are enforced separately (see
# deploy/ops/README.md and docs/security/sandman-threat-model.md).
[Service]
# No setuid/setgid/file capabilities, immutable kernel interfaces.
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
# The daemon needs only its state directory and the docker socket.
PrivateTmp=true
ProtectSystem=strict
# read-only rather than hidden: a pipeline that declares a read-only host
# volume under /home keeps working. Any writable host path outside
# /var/lib/sandman needs an explicit ReadWritePaths= entry in a drop-in.
ProtectHome=read-only
ReadWritePaths=/var/lib/sandman
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
# Go's net package uses AF_NETLINK for interface enumeration; mDNS uses
# AF_INET/AF_INET6 multicast; docker is reached through AF_UNIX.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
